<!--
  REFERENCE PROTOTYPE — /workspaces/:workspaceId/projects/:projectId/monitors/:monitorId/scans/:scanId
                        and the direct route /scans/:scanId
  Not production code. Port into apps/web per AGENTS.md; do not ship this file.

  Scope (README): scan result details.
  API used:
    GET  /api/scans/:scanId                  "Returns a scan and its findings". Fields ASSUMED:
         id, status, createdAt, startedAt?, finishedAt?, httpStatus?, responseTimeMs?, errorMessage?/errorCode?,
         monitor {id, targetUrl}?, findings[{ id, code, severity }]
    POST /api/monitors/:monitorId/scans      "Run again" (OWNER/ADMIN), 202 + QUEUED scan
  Verify every field against apps/api/prisma/schema.prisma. If the scan has no startedAt/finishedAt, collapse
  the timeline to status only. If the direct route /scans/:id does not return the monitor/project/workspace,
  the breadcrumb must degrade to what is known.
  Poll GET /api/scans/:scanId while status is QUEUED or RUNNING, stop at SUCCEEDED/FAILED.

  Domain rules shown (README): SUCCEEDED means the target answered, 4xx/5xx still SUCCEEDED with findings;
  FAILED means timeout, DNS or connection failure (no HTTP result, no broker retry).
  Findings: HTTP_CLIENT_ERROR MEDIUM, HTTP_SERVER_ERROR HIGH, SLOW_RESPONSE MEDIUM (>= 2000 ms). Severities allow
  LOW/MEDIUM/HIGH/CRITICAL. Finding title/explanation text is front-end copy keyed by `code`; unknown codes need a
  generic fallback.
  Not designed (no API): notes, acknowledge/resolve findings, share, export, compare scans.

  Query flags (prototype only, remove in the port):
    ?scan=ok|findings|failed|running|queued   (default findings)    ?then=ok|findings|failed (result after running/queued)
    ?role=owner|admin|member   ?state=loading|error|notfound   ?motion=reduce

  Reuses the app shell from dashboard-prototype.html (widgets/app-shell). Sample data is demo only.
-->

<style>
:root {
  --bg: #0A0E0D;
  --bg-2: #0D1311;
  --surface: #111715;
  --surface-2: #17201C;
  --border: #22302B;
  --border-strong: #2E4039;
  --text: #E8F1EC;
  --text-2: #B6C6BE;
  --muted: #93A59C;
  --accent: #5EF2A0;
  --accent-ink: #04140C;
  --info: #7CC4FF;
  --warn: #FFB454;
  --danger: #FF7A6B;
  --danger-text: #FF9A8D;
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --sidebar-w: 264px;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
p { margin: 0; }
[hidden] { display: none !important; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Ambient background ---------- */
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.ambient::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(232,241,236,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,241,236,.035) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 70% 0%, #000 0%, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 60% at 70% 0%, #000 0%, transparent 75%);
}
.ambient::after {
  content: ''; position: absolute; width: 900px; height: 900px; right: -200px; top: -460px;
  background: radial-gradient(circle, rgba(124,196,255,.07), transparent 62%);
  animation: drift 14s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate3d(-80px, 40px, 0) scale(1.08); } }

/* ---------- Layout ---------- */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100svh; }

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky; top: 0; height: 100svh; display: flex; flex-direction: column; gap: 22px;
  padding: 18px 16px; background: rgba(13,19,17,.82); border-right: 1px solid var(--border);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.logo { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px; font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-label { padding: 0 12px; margin: 4px 0 2px; font: 500 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nav a {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px;
  border-radius: 12px; color: var(--text-2); font-size: 16px; font-weight: 500;
  transition: background .2s, color .2s;
}
.nav a svg { flex: none; opacity: .85; }
.nav a:hover { background: var(--surface); color: var(--text); }
.nav a[aria-current="page"] { background: var(--surface-2); color: var(--text); }
.nav a[aria-current="page"]::before {
  content: ''; position: absolute; left: -16px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0;
  background: var(--accent); box-shadow: 0 0 12px var(--accent);
}
.nav .ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); flex: none; margin: 0 5px; }
.nav a:hover .ws-dot { background: var(--text-2); }
.nav .ws-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
.nav-empty { padding: 8px 12px; font-size: 15px; color: var(--muted); }

.user { border-top: 1px solid var(--border); padding-top: 14px; display: flex; align-items: center; gap: 12px; }
.avatar {
  flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--surface-2), var(--border-strong)); border: 1px solid var(--border-strong);
  font: 700 15px var(--font-display);
}
.user-meta { min-width: 0; flex: 1; line-height: 1.25; }
.user-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-mail { font: 400 13px var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 1px solid transparent;
  border-radius: 12px; color: var(--muted); cursor: pointer; transition: background .2s, color .2s, border-color .2s;
}
.icon-btn:hover { background: var(--surface); color: var(--text); border-color: var(--border); }

/* ---------- Main ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.mobilebar { display: none; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: rgba(10,14,13,.85); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20; }
.content { width: 100%; max-width: 1160px; margin: 0 auto; padding: 44px 40px 72px; }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; }
.eyebrow { font: 500 13px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 10px; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(94,242,160,.6); animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(94,242,160,.55); } 70%,100% { box-shadow: 0 0 0 10px rgba(94,242,160,0); } }
h1 { font-size: clamp(32px, 4vw, 46px); line-height: 1.08; letter-spacing: -.02em; margin-top: 10px; }
.sub { margin-top: 8px; color: var(--muted); font-size: 17px; max-width: 52ch; }

.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font: 600 16px var(--font-body);
  transition: transform .15s, box-shadow .25s;
}
.btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%); transform: translateX(-120%); }
.btn:hover { box-shadow: 0 0 0 4px rgba(94,242,160,.12), 0 8px 22px -10px rgba(94,242,160,.4); }
.btn:hover::after { transform: translateX(120%); transition: transform .7s ease; }
.btn:active { transform: scale(.98); }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border-strong); }
.btn-ghost::after { display: none; }
.btn-ghost:hover { background: var(--surface); box-shadow: none; }

/* heartbeat divider */
.trace { position: relative; height: 22px; margin: 28px 0 24px; }
.trace svg { width: 100%; height: 22px; display: block; overflow: visible; }
.trace .line { stroke: var(--border-strong); stroke-width: 1.2; fill: none; vector-effect: non-scaling-stroke; }
.trace .beam { stroke: var(--text-2); stroke-width: 1.6; fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 90 1200; stroke-dashoffset: 90; animation: travel 5.5s linear infinite; filter: drop-shadow(0 0 3px rgba(232,241,236,.5)); }
@keyframes travel { to { stroke-dashoffset: -1200; } }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin: 30px 0 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 0 16px; border-radius: 999px; background: transparent; border: 1px solid var(--border);
  color: var(--text-2); font-size: 15px; font-weight: 500; cursor: pointer; transition: background .2s, color .2s, border-color .2s;
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--surface-2); border-color: var(--muted); color: var(--text); }
.chip .n { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin-left: 6px; }
.search { position: relative; flex: 1 1 260px; max-width: 340px; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; min-height: 44px; padding: 0 14px 0 42px; background: rgba(10,14,13,.7); border: 1px solid var(--border);
  border-radius: 14px; color: var(--text); font: 400 16px var(--font-body); transition: border-color .2s, box-shadow .2s;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--text-2); box-shadow: 0 0 0 4px rgba(232,241,236,.08); }

/* entrance */
.rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- Skeleton ---------- */
.skel { min-height: 176px; border-radius: 22px; border: 1px solid var(--border); background: rgba(17,23,21,.6); position: relative; overflow: hidden; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.skel i { display: block; border-radius: 8px; background: var(--surface-2); }
.skel .a { width: 46px; height: 46px; border-radius: 14px; }
.skel .b { width: 62%; height: 20px; margin-top: 8px; }
.skel .c { width: 38%; height: 14px; }
.skel::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(232,241,236,.05) 50%, transparent 70%); transform: translateX(-100%); animation: sheen 1.5s ease-in-out infinite; }
@keyframes sheen { to { transform: translateX(100%); } }

/* ---------- Empty / error / no-results ---------- */
.panel { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 64px 24px; border: 1px dashed var(--border-strong); border-radius: 26px; background: rgba(17,23,21,.5); }
.panel h2 { font-size: 28px; letter-spacing: -.01em; }
.panel p { color: var(--muted); max-width: 46ch; }
.panel .btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 10px; }
.panel .art { width: 120px; height: 120px; margin-bottom: 6px; }
.art .ring { transform-origin: 60px 60px; animation: spin 18s linear infinite; }
.art .pulse { stroke-dasharray: 140; stroke-dashoffset: 140; animation: draw 3s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes draw { 0% { stroke-dashoffset: 140; } 55%,100% { stroke-dashoffset: 0; } }

.banner { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; border-radius: 16px; border: 1px solid rgba(255,122,107,.45); background: rgba(255,122,107,.07); color: var(--danger-text); animation: drop .5s cubic-bezier(.2,.8,.2,1) both; }
.banner strong { display: block; font-weight: 600; font-size: 17px; }
.banner small { display: block; margin-top: 2px; font: 400 13px var(--font-mono); color: var(--muted); }
.banner .btn { margin-left: auto; min-height: 40px; padding: 0 18px; font-size: 15px; }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

/* ---------- Mobile drawer ---------- */
.scrim { display: none; }
@media (max-width: 959px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; z-index: 40; left: 0; top: 0; width: min(300px, 86vw); transform: translateX(-102%);
    transition: transform .35s cubic-bezier(.2,.8,.2,1); background: rgba(10,14,13,.97);
  }
  .nav-open .sidebar { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .nav-open .scrim { opacity: 1; pointer-events: auto; }
  .mobilebar { display: flex; }
  .content { padding: 28px 16px 56px; }
}
@media (max-width: 520px) {
  .head .btn { width: 100%; }
  .search { max-width: none; flex-basis: 100%; }
  .pgrid { grid-template-columns: minmax(0, 1fr); }
  .banner { flex-wrap: wrap; }
  .banner .btn { margin-left: 0; width: 100%; }
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after { animation: none !important; transition: none !important; }

/* ---------- Shared bits (also in dashboard) ---------- */
.role { font: 500 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid currentColor; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.role svg { width: 12px; height: 12px; }
.role.owner { color: var(--text); background: rgba(232,241,236,.06); }
.role.admin { color: var(--info); background: rgba(124,196,255,.08); }
.role.member { color: var(--muted); background: rgba(147,165,156,.06); }
.mark { flex: none; display: grid; place-items: center; font: 700 19px var(--font-display); color: var(--text); }
.nav a.current { background: var(--surface-2); color: var(--text); }
.nav a.current .ws-dot { background: var(--info); box-shadow: 0 0 8px var(--info); }

/* ---------- Breadcrumb ---------- */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 400 14px var(--font-mono); color: var(--muted); margin-bottom: 18px; }
.crumbs a { display: inline-flex; align-items: center; min-height: 32px; border-radius: 6px; }
.crumbs a:hover { color: var(--text); }
.crumbs [aria-current] { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }

.btn[disabled] { opacity: .45; cursor: not-allowed; }
.viewonly { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 14px; color: var(--muted); font-size: 15px; background: rgba(10,14,13,.5); }

/* ---------- Form controls ---------- */
.field-in { width: 100%; min-height: 48px; padding: 0 14px; background: rgba(10,14,13,.8); border: 1px solid var(--border-strong); border-radius: 14px; color: var(--text); font: 400 16px var(--font-body); transition: border-color .2s, box-shadow .2s; }
textarea.field-in { padding: 12px 14px; min-height: 96px; resize: vertical; line-height: 1.45; }
.field-in::placeholder { color: var(--muted); }
.field-in:focus { outline: none; border-color: var(--text-2); box-shadow: 0 0 0 4px rgba(232,241,236,.08); }
.field-in[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(255,122,107,.12); }
.err { min-height: 20px; margin-top: 6px; font-size: 14px; color: var(--danger-text); }
.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; width: 100%; min-height: 44px; padding: 0 36px 0 14px; background: rgba(10,14,13,.8); border: 1px solid var(--border-strong); border-radius: 12px; color: var(--text); font: 500 15px var(--font-body); cursor: pointer; }
.sel select:focus { outline: none; border-color: var(--text-2); box-shadow: 0 0 0 4px rgba(232,241,236,.08); }
.sel::after { content: ''; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; margin-top: -6px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
.btn-sm { min-height: 40px; padding: 0 16px; font-size: 14px; }
.btn-danger { background: transparent; color: var(--danger-text); border: 1px solid rgba(255,122,107,.4); }
.btn-danger::after { display: none; }
.btn-danger:hover { background: rgba(255,122,107,.1); box-shadow: none; }

/* ---------- Toast ---------- */
.toasts { position: fixed; z-index: 80; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--border-strong); box-shadow: 0 20px 40px -16px rgba(0,0,0,.8); font-size: 15px; animation: toast-in .4s cubic-bezier(.2,.8,.2,1) both; }
.toast .ok { width: 20px; height: 20px; flex: none; color: var(--accent); }
.toast.out { animation: toast-out .3s ease forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }


/* ---------- Project header ---------- */
.phead { --t: 232,241,236; position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; padding: 26px 28px; border: 1px solid var(--border); border-radius: 26px; overflow: hidden; background: rgba(17,23,21,.78); }
.phead::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 140% at 0% 0%, rgba(var(--t), .12), transparent 60%); }
.phead > * { position: relative; }
.phead-id { display: flex; align-items: center; gap: 18px; min-width: 0; }
.pbadge { flex: none; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(var(--t), .2), var(--bg-2)); border: 1px solid rgba(var(--t), .4); color: var(--text); box-shadow: 0 14px 30px -12px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08); }
.phead h1 { font-size: clamp(26px, 3.2vw, 38px); margin: 0; overflow-wrap: anywhere; }
.phead .pdesc { margin-top: 6px; color: var(--muted); font-size: 16px; max-width: 62ch; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font: 400 14px var(--font-mono); color: var(--muted); }
.hero-meta span + span::before { content: '·'; margin-right: 14px; color: var(--border-strong); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* scan lifecycle chip (statuses are real data: shown only after a scan is triggered here) */
.chip-s { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid currentColor; font: 500 12px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; animation: pop-in .35s cubic-bezier(.2,.8,.2,1) both; }
.chip-s i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.chip-s.queued { color: var(--muted); }
.chip-s.queued i { animation: blink 1.2s ease-in-out infinite; }
.chip-s.running { color: var(--info); background: rgba(124,196,255,.08); }
.chip-s.running i { box-shadow: 0 0 0 0 rgba(124,196,255,.6); animation: ping-b 1.4s ease-out infinite; }
.chip-s.succeeded { color: var(--accent); background: rgba(94,242,160,.07); }
.chip-s.warn { color: var(--warn); background: rgba(255,180,84,.08); }
.chip-s.failed { color: var(--danger-text); background: rgba(255,122,107,.08); }
@keyframes blink { 50% { opacity: .25; } }
@keyframes ping-b { 0% { box-shadow: 0 0 0 0 rgba(124,196,255,.55); } 70%,100% { box-shadow: 0 0 0 9px rgba(124,196,255,0); } }
@keyframes pop-in { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(380%); } }



/* ---------- Scan hero ---------- */
.shero { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 22px; padding: 28px; border: 1px solid var(--border); border-radius: 28px; overflow: hidden; background: rgba(17,23,21,.78); --c: 147,165,156; }
.shero::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 160% at 0% 0%, rgba(var(--c), .16), transparent 60%); transition: background .6s; }
.shero > * { position: relative; }

    var v = view(s), busy = s.status === 'QUEUED' || s.status === 'RUNNING';
    var action = canManage ? '<button class="btn" type="button" id="again"' + (busy ? ' disabled' : '') + '>' + PLAY + 'Run scan again</button>' : '<div class="viewonly">' + LOCK + 'View-only access.</div>';
    return '<header class="shero ' + v.tone + ' rise" style="--i:1" id="shero"><div class="shero-id">' + orbSvg(v.orb) + '<div style="min-width:0"><span class="chip-s ' + ({ QUEUED: 'queued', RUNNING: 'running', SUCCEEDED: s.findings.length ? 'warn' : 'succeeded', FAILED: 'failed' })[s.status] + '" style="margin-bottom:12px"><i></i>' + s.status.charAt(0) + s.status.slice(1).toLowerCase() + '</span>' +
      '<h1>' + esc(v.title) + '</h1><p class="sub2">' + esc(v.sub) + '</p><div class="hero-meta"><span>' + esc(HOST) + '</span><span title="' + fmtFull(s.createdAt) + '">Started ' + rel(s.createdAt) + '</span></div></div></div><div class="hero-actions">' + action + '</div></header>';
  }
  function tiles(s) {
    var http = s.httpStatus, cls = http ? 'c' + String(http)[0] : 'cnone';
    var hs = http ? ({ 200: 'OK', 404: 'Not Found', 503: 'Service Unavailable', 500: 'Internal Server Error' }[http] || '') : (s.status === 'FAILED' ? 'No response' : 'Pending');
    var rt = s.responseTimeMs, pct = rt ? Math.min(100, rt / METER_MAX * 100) : 0;
    var counts = {}; s.findings.forEach(function (f) { counts[f.severity] = (counts[f.severity] || 0) + 1; });
    var sev = Object.keys(counts).sort(function (a, b) { return SEV_RANK[b] - SEV_RANK[a]; }).map(function (k) { return '<span class="sev ' + k.toLowerCase() + '">' + counts[k] + ' ' + k.toLowerCase() + '</span>'; }).join('');
    return '<div class="tiles3 rise" style="--i:2">' +
      '<div class="mt"><div class="mt-k">HTTP status</div><div class="mt-v ' + cls + '">' + (http || '—') + '</div><div class="mt-s">' + hs + '</div></div>' +
      '<div class="mt"><div class="mt-k">Response time</div><div class="mt-v">' + (rt ? rt.toLocaleString('en-US') + '<small>ms</small>' : '<span style="color:var(--muted)">—</span>') + '</div>' +
      '<div class="meter" aria-hidden="true"><i class="' + (rt >= SLOW_MS ? 'slow' : '') + '" data-w="' + pct + '"></i><b style="left:' + (SLOW_MS / METER_MAX * 100) + '%"></b></div><div class="mt-s">' + (rt ? (rt >= SLOW_MS ? 'Above the 2,000 ms slow threshold' : 'Under the 2,000 ms slow threshold') : 'Not measured') + '</div></div>' +
      '<div class="mt"><div class="mt-k">Findings</div><div class="mt-v">' + (s.status === 'SUCCEEDED' ? s.findings.length : '—') + '</div>' + (sev ? '<div class="sev-row">' + sev + '</div>' : '<div class="mt-s">' + (s.status === 'SUCCEEDED' ? 'Nothing to report' : s.status === 'FAILED' ? 'No result to evaluate' : 'Evaluated when the scan finishes') + '</div>') + '</div></div>';
  }
  function timeline(s) {
    var q = s.startedAt || s.status === 'FAILED' || s.finishedAt;
    function li(cls, mark, title, sub, time) { return '<li class="' + cls + '"><span class="dot">' + mark + '</span><div><div class="t-title">' + title + '</div><div class="t-sub">' + sub + '</div></div><span class="t-time">' + (time || '') + '</span></li>'; }
    var steps = [];
    steps.push(li('done', '✓', 'Queued', s.startedAt ? 'Waited ' + dur(s.createdAt, s.startedAt) + ' for a worker' : 'Waiting for a worker', fmtClock(s.createdAt)));
    if (s.status === 'QUEUED') steps.push(li('pending', '', 'Running', 'Starts when a worker picks it up', ''));
    else steps.push(li(s.status === 'RUNNING' ? 'active' : 'done', s.status === 'RUNNING' ? '' : '✓', 'Running', s.status === 'RUNNING' ? 'Request in flight…' : 'Worker validated the URL and sent the request', fmtClock(s.startedAt)));
    if (s.status === 'SUCCEEDED') steps.push(li('done', '✓', 'Succeeded', 'Took ' + dur(s.startedAt, s.finishedAt) + ' end to end', fmtClock(s.finishedAt)));
    else if (s.status === 'FAILED') steps.push(li('bad', '×', 'Failed', 'Gave up after ' + dur(s.startedAt, s.finishedAt) + '. Not retried.', fmtClock(s.finishedAt)));
    else steps.push(li('pending', '', 'Finished', 'Result and findings appear here', ''));
    return '<section class="box" aria-labelledby="tl-h"><h2 id="tl-h">Lifecycle</h2><ol class="tl">' + steps.join('') + '</ol></section>';
  }
  function request(s) {
    return '<section class="box" aria-labelledby="rq-h"><h2 id="rq-h">Request</h2><dl class="kv">' +
      '<dt>Target</dt><dd class="mono">' + esc(TARGET) + '<button class="cp" type="button" data-copy="' + esc(TARGET) + '" aria-label="Copy target URL">' + COPY + '</button></dd>' +
      '<dt>Method</dt><dd>GET, redirects are not followed</dd>' +
      '<dt>Scan ID</dt><dd class="mono">' + esc(s.id) + '<button class="cp" type="button" data-copy="' + esc(s.id) + '" aria-label="Copy scan ID">' + COPY + '</button></dd>' +
      '<dt>Created</dt><dd>' + fmtFull(s.createdAt) + '</dd>' +
      '<dt>Finished</dt><dd>' + (s.finishedAt ? fmtFull(s.finishedAt) : '<span style="color:var(--muted)">Not finished yet</span>') + '</dd></dl></section>';
  }
  var COPYTXT = {
    HTTP_CLIENT_ERROR: function (s) { return ['Client error response', 'The target returned HTTP ' + s.httpStatus + '. A 4xx response means the request was rejected or the page was not found.']; },
    HTTP_SERVER_ERROR: function (s) { return ['Server error response', 'The target returned HTTP ' + s.httpStatus + '. A 5xx response usually means the service is failing or unavailable.']; },
    SLOW_RESPONSE: function (s) { return ['Slow response', 'The target took ' + s.responseTimeMs.toLocaleString('en-US') + ' ms to respond. Responses of ' + SLOW_MS.toLocaleString('en-US') + ' ms or more are flagged.']; }
  };
  function findings(s) {
    var head = function (p) { return '<div class="fhead rise" style="--i:4"><h2>Findings</h2><p>' + p + '</p></div>'; };
    if (s.status === 'QUEUED' || s.status === 'RUNNING') return head('Evaluated when the scan finishes') + '<div class="waiting"><strong>Findings will appear here</strong>This page updates by itself while the scan is in progress.</div>';
    if (s.status === 'FAILED') return head('Not evaluated') + '<div class="failbox"><svg width="28" height="28" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 6 V11 M10 13.6 V14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><div><h3>' + esc(s.error.message) + '</h3><p>A scan fails on timeouts, DNS errors and connection failures. There is no HTTP result to evaluate, and failed scans are not retried automatically. Check the target is reachable from the public internet, then run the scan again.</p><code>' + esc(s.error.code) + '</code></div></div>';
    if (!s.findings.length) return head('0 issues from this scan') + '<div class="good"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 12.4 L10.6 15.4 L16.5 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><div><h3>No findings</h3><p>The target answered with HTTP ' + s.httpStatus + ' in ' + s.responseTimeMs + ' ms. No client error, server error or slow response was detected.</p></div></div>';
    var list = s.findings.slice().sort(function (a, b) { return SEV_RANK[b.severity] - SEV_RANK[a.severity]; });
    return head(list.length + ' issue' + (list.length > 1 ? 's' : '') + ' found, most severe first') + '<div class="finds">' + list.map(function (f, i) {
      var t = (COPYTXT[f.code] || function () { return [f.code.replace(/_/g, ' ').toLowerCase().replace(/^./, function (c) { return c.toUpperCase(); }), 'This scan produced a finding of type ' + f.code + '.']; })(s);
      return '<article class="find sev-' + f.severity.toLowerCase() + '" style="--i:' + i + '"><span class="sev ' + f.severity.toLowerCase() + '">' + f.severity + '</span><div><h3>' + esc(t[0]) + '</h3><p>' + esc(t[1]) + '</p><code>' + esc(f.code) + '</code></div></article>';
    }).join('') + '</div>';
  }

  /* ---------- render ---------- */
  function render() {
    stage.innerHTML = hero(scan) + tiles(scan) + '<div class="two rise" style="--i:3">' + timeline(scan) + request(scan) + '</div>' + findings(scan);
    requestAnimationFrame(function () { document.querySelectorAll('.meter i').forEach(function (i) { i.style.width = i.dataset.w + '%'; }); });
    var ag = $('again'); if (ag) ag.addEventListener('click', again);
    document.querySelectorAll('[data-copy]').forEach(function (b) { b.addEventListener('click', function () { try { navigator.clipboard.writeText(b.dataset.copy); } catch (e) {} toast('Copied.'); }); });
  }

  /* simulated lifecycle (poll GET /scans/:id) */
  function advance(kind) {
    if (scan.status === 'QUEUED') setTimeout(function () { scan.status = 'RUNNING'; scan.startedAt = iso(Date.now()); render(); advance(kind); }, 1800);
    else if (scan.status === 'RUNNING') setTimeout(function () {
      var r = build(kind, new Date(scan.createdAt).getTime()); r.id = scan.id; r.createdAt = scan.createdAt; r.startedAt = scan.startedAt; r.finishedAt = iso(Date.now()); scan = r; render();
      toast(r.status === 'FAILED' ? 'Scan failed.' : 'Scan finished.');
    }, 2600);
  }
  function again() {
    scan = build('queued', Date.now()); scan.id = 'scn_' + Math.random().toString(16).slice(2, 10); render(); toast('Scan queued for ' + HOST + '.'); advance(then === 'queued' ? 'ok' : then);
  }

  /* ---------- states ---------- */
  function showLoading() {
    stage.innerHTML = '<div class="shero" aria-busy="true"><div class="skel" style="min-height:0;border:0;background:none;padding:0;width:min(460px,100%)"><i class="a" style="width:96px;height:96px;border-radius:50%"></i><i class="b"></i><i class="c"></i></div></div><div class="tiles3">' + [0, 1, 2].map(function () { return '<div class="skel" style="min-height:120px"><i class="c"></i><i class="b" style="margin-top:0"></i></div>'; }).join('') + '</div>';
  }
  function showError() {
    banner.hidden = false;
    banner.innerHTML = '<div class="banner" role="alert"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 6 V11 M10 13.6 V14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><div><strong>Couldn’t load this scan.</strong><small>Request ID: req-demo-b02f</small></div><button class="btn btn-ghost" type="button" id="retry">Try again</button></div>';
    $('retry').addEventListener('click', function () { var p = new URLSearchParams(location.search); p.delete('state'); location.search = p.toString(); });
  }
  function showNotFound() { stage.innerHTML = '<div class="panel">' + ART + '<h2>Scan not found</h2><p>It may not exist, or you may not be a member of this workspace.</p><div class="btns"><a class="btn" href="#">Back to monitor</a></div></div>'; }

  if (state === 'loading') showLoading(); else if (state === 'error') showError(); else if (state === 'notfound') showNotFound();
  else { render(); if (scan.status === 'QUEUED' || scan.status === 'RUNNING') advance(then === 'queued' ? 'ok' : then); }

  var app = $('app'), menu = $('menu-btn');
  function setNav(open) { app.classList.toggle('nav-open', open); menu.setAttribute('aria-expanded', String(open)); if (open) $('sidebar').querySelector('a').focus(); else menu.focus(); }
  menu.addEventListener('click', function () { setNav(true); });
  $('scrim').addEventListener('click', function () { setNav(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && app.classList.contains('nav-open')) setNav(false); });
  document.addEventListener('click', function (e) { var a = e.target.closest('a[href="#"]'); if (a) e.preventDefault(); });
})();
</script>
</body>
</html>
