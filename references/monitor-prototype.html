<title>OntaPulse — Monitor (reference prototype)</title>
<meta name="color-scheme" content="dark">

<!--
  REFERENCE PROTOTYPE — /workspaces/:workspaceId/projects/:projectId/monitors/:monitorId
  Not production code. Port into apps/web per AGENTS.md; do not ship this file.

  Scope (README): monitor details and scan history.
  API used:
    GET  /api/projects/:projectId/monitors      (monitor fields assumed: id, targetUrl, intervalSeconds, createdAt)
    GET  /api/monitors/:monitorId/scans         "recent scans"; fields ASSUMED per item:
                                                id, status, createdAt, httpStatus (nullable), responseTimeMs (nullable)
    POST /api/monitors/:monitorId/scans         202 + QUEUED scan (OWNER/ADMIN)
    GET  /api/scans/:scanId                     polled while QUEUED/RUNNING
  Verify the scan fields against apps/api/prisma/schema.prisma before porting. If the list item has no
  httpStatus/responseTimeMs, drop those columns and the chart; do not add a per-scan fetch to fill them.
  The response-time chart is derived on the client from the recent scans list. It is NOT an aggregate
  endpoint (the API has no uptime, SLA or trend aggregates). The 2,000 ms line mirrors the SLOW_RESPONSE
  finding rule. Findings themselves live on the scan detail screen, not here.
  Not available in the API, so not designed: edit/delete/pause monitor, uptime %, incident history.

  Semantics shown to the user: SUCCEEDED means the target answered (a 4xx/5xx is still SUCCEEDED and
  produces findings); FAILED means timeout, DNS or connection failure.
  Role rules (README): run scan OWNER/ADMIN; MEMBER read-only.

  Query flags (prototype only, remove in the port):
    ?role=owner|admin|member    ?state=loading|empty|error|notfound    ?motion=reduce

  Reuses the app shell from dashboard-prototype.html (widgets/app-shell). Sample data is demo only.
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0A0E0D;
  --bg-2: #0D1311;
  --surface: #111715;
  --surface-2: #17201C;
  --border: #22302B;
  --border-strong: #2E4039;
  --text: #E8F1EC;
  --text-2: #B6C6BE;
  --muted: #93A59C;
  --accent: #5EF2A0;
  --accent-ink: #04140C;
  --info: #7CC4FF;
  --warn: #FFB454;
  --danger: #FF7A6B;
  --danger-text: #FF9A8D;
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --sidebar-w: 264px;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
p { margin: 0; }
[hidden] { display: none !important; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Ambient background ---------- */
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.ambient::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(232,241,236,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,241,236,.035) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 70% 0%, #000 0%, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 60% at 70% 0%, #000 0%, transparent 75%);
}
.ambient::after {
  content: ''; position: absolute; width: 900px; height: 900px; right: -200px; top: -460px;
  background: radial-gradient(circle, rgba(124,196,255,.07), transparent 62%);
  animation: drift 14s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate3d(-80px, 40px, 0) scale(1.08); } }

/* ---------- Layout ---------- */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100svh; }

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky; top: 0; height: 100svh; display: flex; flex-direction: column; gap: 22px;
  padding: 18px 16px; background: rgba(13,19,17,.82); border-right: 1px solid var(--border);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.logo { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px; font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-label { padding: 0 12px; margin: 4px 0 2px; font: 500 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nav a {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px;
  border-radius: 12px; color: var(--text-2); font-size: 16px; font-weight: 500;
  transition: background .2s, color .2s;
}
.nav a svg { flex: none; opacity: .85; }
.nav a:hover { background: var(--surface); color: var(--text); }
.nav a[aria-current="page"] { background: var(--surface-2); color: var(--text); }
.nav a[aria-current="page"]::before {
  content: ''; position: absolute; left: -16px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0;
  background: var(--accent); box-shadow: 0 0 12px var(--accent);
}
.nav .ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); flex: none; margin: 0 5px; }
.nav a:hover .ws-dot { background: var(--text-2); }
.nav .ws-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
.nav-empty { padding: 8px 12px; font-size: 15px; color: var(--muted); }

.user { border-top: 1px solid var(--border); padding-top: 14px; display: flex; align-items: center; gap: 12px; }
.avatar {
  flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--surface-2), var(--border-strong)); border: 1px solid var(--border-strong);
  font: 700 15px var(--font-display);
}
.user-meta { min-width: 0; flex: 1; line-height: 1.25; }
.user-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-mail { font: 400 13px var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 1px solid transparent;
  border-radius: 12px; color: var(--muted); cursor: pointer; transition: background .2s, color .2s, border-color .2s;
}
.icon-btn:hover { background: var(--surface); color: var(--text); border-color: var(--border); }

/* ---------- Main ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.mobilebar { display: none; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: rgba(10,14,13,.85); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20; }
.content { width: 100%; max-width: 1160px; margin: 0 auto; padding: 44px 40px 72px; }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; }
.eyebrow { font: 500 13px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 10px; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(94,242,160,.6); animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(94,242,160,.55); } 70%,100% { box-shadow: 0 0 0 10px rgba(94,242,160,0); } }
h1 { font-size: clamp(32px, 4vw, 46px); line-height: 1.08; letter-spacing: -.02em; margin-top: 10px; }
.sub { margin-top: 8px; color: var(--muted); font-size: 17px; max-width: 52ch; }

.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font: 600 16px var(--font-body);
  transition: transform .15s, box-shadow .25s;
}
.btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%); transform: translateX(-120%); }
.btn:hover { box-shadow: 0 0 0 4px rgba(94,242,160,.12), 0 8px 22px -10px rgba(94,242,160,.4); }
.btn:hover::after { transform: translateX(120%); transition: transform .7s ease; }
.btn:active { transform: scale(.98); }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border-strong); }
.btn-ghost::after { display: none; }
.btn-ghost:hover { background: var(--surface); box-shadow: none; }

/* heartbeat divider */
.trace { position: relative; height: 22px; margin: 28px 0 24px; }
.trace svg { width: 100%; height: 22px; display: block; overflow: visible; }
.trace .line { stroke: var(--border-strong); stroke-width: 1.2; fill: none; vector-effect: non-scaling-stroke; }
.trace .beam { stroke: var(--text-2); stroke-width: 1.6; fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 90 1200; stroke-dashoffset: 90; animation: travel 5.5s linear infinite; filter: drop-shadow(0 0 3px rgba(232,241,236,.5)); }
@keyframes travel { to { stroke-dashoffset: -1200; } }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin: 30px 0 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 0 16px; border-radius: 999px; background: transparent; border: 1px solid var(--border);
  color: var(--text-2); font-size: 15px; font-weight: 500; cursor: pointer; transition: background .2s, color .2s, border-color .2s;
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--surface-2); border-color: var(--muted); color: var(--text); }
.chip .n { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin-left: 6px; }
.search { position: relative; flex: 1 1 260px; max-width: 340px; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; min-height: 44px; padding: 0 14px 0 42px; background: rgba(10,14,13,.7); border: 1px solid var(--border);
  border-radius: 14px; color: var(--text); font: 400 16px var(--font-body); transition: border-color .2s, box-shadow .2s;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--text-2); box-shadow: 0 0 0 4px rgba(232,241,236,.08); }

/* entrance */
.rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- Skeleton ---------- */
.skel { min-height: 176px; border-radius: 22px; border: 1px solid var(--border); background: rgba(17,23,21,.6); position: relative; overflow: hidden; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.skel i { display: block; border-radius: 8px; background: var(--surface-2); }
.skel .a { width: 46px; height: 46px; border-radius: 14px; }
.skel .b { width: 62%; height: 20px; margin-top: 8px; }
.skel .c { width: 38%; height: 14px; }
.skel::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(232,241,236,.05) 50%, transparent 70%); transform: translateX(-100%); animation: sheen 1.5s ease-in-out infinite; }
@keyframes sheen { to { transform: translateX(100%); } }

/* ---------- Empty / error / no-results ---------- */
.panel { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 64px 24px; border: 1px dashed var(--border-strong); border-radius: 26px; background: rgba(17,23,21,.5); }
.panel h2 { font-size: 28px; letter-spacing: -.01em; }
.panel p { color: var(--muted); max-width: 46ch; }
.panel .btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 10px; }
.panel .art { width: 120px; height: 120px; margin-bottom: 6px; }
.art .ring { transform-origin: 60px 60px; animation: spin 18s linear infinite; }
.art .pulse { stroke-dasharray: 140; stroke-dashoffset: 140; animation: draw 3s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes draw { 0% { stroke-dashoffset: 140; } 55%,100% { stroke-dashoffset: 0; } }

.banner { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; border-radius: 16px; border: 1px solid rgba(255,122,107,.45); background: rgba(255,122,107,.07); color: var(--danger-text); animation: drop .5s cubic-bezier(.2,.8,.2,1) both; }
.banner strong { display: block; font-weight: 600; font-size: 17px; }
.banner small { display: block; margin-top: 2px; font: 400 13px var(--font-mono); color: var(--muted); }
.banner .btn { margin-left: auto; min-height: 40px; padding: 0 18px; font-size: 15px; }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

/* ---------- Mobile drawer ---------- */
.scrim { display: none; }
@media (max-width: 959px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; z-index: 40; left: 0; top: 0; width: min(300px, 86vw); transform: translateX(-102%);
    transition: transform .35s cubic-bezier(.2,.8,.2,1); background: rgba(10,14,13,.97);
  }
  .nav-open .sidebar { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .nav-open .scrim { opacity: 1; pointer-events: auto; }
  .mobilebar { display: flex; }
  .content { padding: 28px 16px 56px; }
}
@media (max-width: 520px) {
  .head .btn { width: 100%; }
  .search { max-width: none; flex-basis: 100%; }
  .pgrid { grid-template-columns: minmax(0, 1fr); }
  .banner { flex-wrap: wrap; }
  .banner .btn { margin-left: 0; width: 100%; }
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after { animation: none !important; transition: none !important; }

/* ---------- Shared bits (also in dashboard) ---------- */
.role { font: 500 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid currentColor; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.role svg { width: 12px; height: 12px; }
.role.owner { color: var(--text); background: rgba(232,241,236,.06); }
.role.admin { color: var(--info); background: rgba(124,196,255,.08); }
.role.member { color: var(--muted); background: rgba(147,165,156,.06); }
.mark { flex: none; display: grid; place-items: center; font: 700 19px var(--font-display); color: var(--text); }
.nav a.current { background: var(--surface-2); color: var(--text); }
.nav a.current .ws-dot { background: var(--info); box-shadow: 0 0 8px var(--info); }

/* ---------- Breadcrumb ---------- */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 400 14px var(--font-mono); color: var(--muted); margin-bottom: 18px; }
.crumbs a { display: inline-flex; align-items: center; min-height: 32px; border-radius: 6px; }
.crumbs a:hover { color: var(--text); }
.crumbs [aria-current] { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }

.btn[disabled] { opacity: .45; cursor: not-allowed; }
.viewonly { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 14px; color: var(--muted); font-size: 15px; background: rgba(10,14,13,.5); }

/* ---------- Form controls ---------- */
.field-in { width: 100%; min-height: 48px; padding: 0 14px; background: rgba(10,14,13,.8); border: 1px solid var(--border-strong); border-radius: 14px; color: var(--text); font: 400 16px var(--font-body); transition: border-color .2s, box-shadow .2s; }
textarea.field-in { padding: 12px 14px; min-height: 96px; resize: vertical; line-height: 1.45; }
.field-in::placeholder { color: var(--muted); }
.field-in:focus { outline: none; border-color: var(--text-2); box-shadow: 0 0 0 4px rgba(232,241,236,.08); }
.field-in[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(255,122,107,.12); }
.err { min-height: 20px; margin-top: 6px; font-size: 14px; color: var(--danger-text); }
.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; width: 100%; min-height: 44px; padding: 0 36px 0 14px; background: rgba(10,14,13,.8); border: 1px solid var(--border-strong); border-radius: 12px; color: var(--text); font: 500 15px var(--font-body); cursor: pointer; }
.sel select:focus { outline: none; border-color: var(--text-2); box-shadow: 0 0 0 4px rgba(232,241,236,.08); }
.sel::after { content: ''; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; margin-top: -6px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
.btn-sm { min-height: 40px; padding: 0 16px; font-size: 14px; }
.btn-danger { background: transparent; color: var(--danger-text); border: 1px solid rgba(255,122,107,.4); }
.btn-danger::after { display: none; }
.btn-danger:hover { background: rgba(255,122,107,.1); box-shadow: none; }

/* ---------- Toast ---------- */
.toasts { position: fixed; z-index: 80; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--border-strong); box-shadow: 0 20px 40px -16px rgba(0,0,0,.8); font-size: 15px; animation: toast-in .4s cubic-bezier(.2,.8,.2,1) both; }
.toast .ok { width: 20px; height: 20px; flex: none; color: var(--accent); }
.toast.out { animation: toast-out .3s ease forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }


/* ---------- Project header ---------- */
.phead { --t: 232,241,236; position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; padding: 26px 28px; border: 1px solid var(--border); border-radius: 26px; overflow: hidden; background: rgba(17,23,21,.78); }
.phead::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 140% at 0% 0%, rgba(var(--t), .12), transparent 60%); }
.phead > * { position: relative; }
.phead-id { display: flex; align-items: center; gap: 18px; min-width: 0; }
.pbadge { flex: none; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(var(--t), .2), var(--bg-2)); border: 1px solid rgba(var(--t), .4); color: var(--text); box-shadow: 0 14px 30px -12px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08); }
.phead h1 { font-size: clamp(26px, 3.2vw, 38px); margin: 0; overflow-wrap: anywhere; }
.phead .pdesc { margin-top: 6px; color: var(--muted); font-size: 16px; max-width: 62ch; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font: 400 14px var(--font-mono); color: var(--muted); }
.hero-meta span + span::before { content: '·'; margin-right: 14px; color: var(--border-strong); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* scan lifecycle chip (statuses are real data: shown only after a scan is triggered here) */
.chip-s { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid currentColor; font: 500 12px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; animation: pop-in .35s cubic-bezier(.2,.8,.2,1) both; }
.chip-s i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.chip-s.queued { color: var(--muted); }
.chip-s.queued i { animation: blink 1.2s ease-in-out infinite; }
.chip-s.running { color: var(--info); background: rgba(124,196,255,.08); }
.chip-s.running i { box-shadow: 0 0 0 0 rgba(124,196,255,.6); animation: ping-b 1.4s ease-out infinite; }
.chip-s.succeeded { color: var(--accent); background: rgba(94,242,160,.07); }
.chip-s.warn { color: var(--warn); background: rgba(255,180,84,.08); }
.chip-s.failed { color: var(--danger-text); background: rgba(255,122,107,.08); }
@keyframes blink { 50% { opacity: .25; } }
@keyframes ping-b { 0% { box-shadow: 0 0 0 0 rgba(124,196,255,.55); } 70%,100% { box-shadow: 0 0 0 9px rgba(124,196,255,0); } }
@keyframes pop-in { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(380%); } }


/* ---------- Monitor header ---------- */
.murlbig { font: 700 clamp(24px, 3vw, 34px)/1.15 var(--font-display); letter-spacing: -.015em; margin: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; overflow-wrap: anywhere; }
.proto { font: 500 12px var(--font-mono); letter-spacing: .06em; padding: 3px 9px; border-radius: 7px; border: 1px solid var(--border-strong); color: var(--text-2); flex: none; }
.pathbig { margin-top: 4px; font: 400 16px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.globebig { flex: none; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(var(--t), .2), var(--bg-2)); border: 1px solid rgba(var(--t), .4); color: var(--text); box-shadow: 0 14px 30px -12px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08); }

/* ---------- Config tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
.tile { position: relative; padding: 16px 18px; border: 1px solid var(--border); border-radius: 18px; background: rgba(17,23,21,.72); min-width: 0; }
.tile-k { font: 500 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tile-v { margin-top: 6px; font: 600 18px var(--font-body); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-s { margin-top: 2px; font-size: 14px; color: var(--muted); }
.tile .copy { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; display: grid; place-items: center; background: none; border: 1px solid transparent; border-radius: 10px; color: var(--muted); cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.tile .copy:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }

/* ---------- Response time chart (derived client-side from the recent scans list) ---------- */
.card-box { margin-top: 26px; padding: 22px; border: 1px solid var(--border); border-radius: 22px; background: rgba(17,23,21,.72); }
.card-box-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 18px; }
.card-box-head h2 { font-size: 20px; letter-spacing: -.01em; }
.card-box-head p { font-size: 14px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--info); }
.legend i.slow { background: var(--warn); }
.legend i.fail { background: none; border: 1.5px solid var(--danger); border-radius: 50%; }
.chart { position: relative; height: 176px; padding-left: 52px; }
.chart .grid-l { position: absolute; left: 52px; right: 0; border-top: 1px dashed var(--border); }
.chart .grid-l span { position: absolute; left: -52px; top: -9px; width: 44px; text-align: right; font: 400 12px var(--font-mono); color: var(--muted); }
.chart .grid-l.slow { border-top-color: rgba(255,180,84,.55); }
.chart .grid-l.slow span { color: var(--warn); }
.bars { position: absolute; left: 52px; right: 0; top: 0; bottom: 0; display: flex; align-items: flex-end; gap: clamp(4px, 1.2vw, 12px); }
.bcol { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; min-width: 0; outline-offset: 2px; border-radius: 6px; }
.bcol .b { width: 100%; max-width: 40px; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, var(--info), rgba(124,196,255,.45)); transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 40ms); transition: filter .2s; }
.bcol .b.slow { background: linear-gradient(180deg, var(--warn), rgba(255,180,84,.45)); }
.bcol .x { position: absolute; bottom: 0; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--danger); color: var(--danger-text); display: grid; place-items: center; font-size: 12px; background: rgba(255,122,107,.1); }
.bcol:hover .b, .bcol:focus-visible .b { filter: brightness(1.25); }
.bcol .tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%) translateY(4px); padding: 6px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border-strong); font: 500 12px var(--font-mono); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 3; }
.bcol:hover .tip, .bcol:focus-visible .tip { opacity: 1; transform: translateX(-50%); }
.bcol.is-new .b { animation: grow .7s cubic-bezier(.2,.8,.2,1) both, glow-b 1.8s ease-out; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes glow-b { 0% { box-shadow: 0 0 0 0 rgba(124,196,255,.7); } 100% { box-shadow: 0 0 0 14px rgba(124,196,255,0); } }
.xlabels { display: flex; padding-left: 52px; margin-top: 8px; gap: clamp(4px, 1.2vw, 12px); font: 400 11px var(--font-mono); color: var(--muted); }
.xlabels span { flex: 1; text-align: center; min-width: 0; overflow: hidden; }

/* ---------- Scan history ---------- */
.hist-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin: 30px 0 16px; }
.hist-head h2 { font-size: 22px; letter-spacing: -.01em; }
.hist-head p { color: var(--muted); font-size: 15px; margin-top: 2px; }
.scans { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 22px; background: rgba(17,23,21,.72); overflow: hidden; }
.srow { --mx: 50%; --my: 50%; position: relative; display: grid; grid-template-columns: 190px 130px 110px minmax(0, 1fr) 24px; align-items: center; gap: 16px; padding: 14px 20px; border-top: 1px solid var(--border); transition: background .25s; }
.srow:first-child { border-top: 0; }
.srow:hover { background: rgba(232,241,236,.03); }
.srow a.stretch { position: absolute; inset: 0; z-index: 1; }
.srow a.stretch:focus-visible { outline-offset: -3px; }
.srow > *:not(.stretch) { position: relative; pointer-events: none; }
.srow.new { animation: flash-n 1.8s ease; }
@keyframes flash-n { 0% { background: rgba(124,196,255,.16); } 100% { background: transparent; } }
.http { white-space: nowrap; display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 8px; font: 500 14px var(--font-mono); border: 1px solid var(--border-strong); color: var(--text-2); }
.http.c4 { color: var(--warn); border-color: rgba(255,180,84,.5); background: rgba(255,180,84,.07); }
.http.c5 { color: var(--danger-text); border-color: rgba(255,122,107,.5); background: rgba(255,122,107,.07); }
.http.none { border-style: dashed; color: var(--muted); }
.rt { font: 500 15px var(--font-mono); color: var(--text-2); font-variant-numeric: tabular-nums; }
.rt.slow { color: var(--warn); }
.rt.none { color: var(--muted); }
.c-when { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
.when-rel { font-size: 15px; color: var(--text-2); }
.when-abs { font: 400 13px var(--font-mono); color: var(--muted); }
.srow .chev { color: var(--muted); font-size: 18px; transition: transform .3s cubic-bezier(.2,.8,.2,1), color .3s; }
.srow:hover .chev { transform: translateX(4px); color: var(--text); }
.srow.head { padding-top: 12px; padding-bottom: 12px; font: 500 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: rgba(10,14,13,.5); }
.srow.head:hover { background: rgba(10,14,13,.5); }
.srow .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; opacity: 0; }
.srow.busy .bar { opacity: 1; }
.srow .bar::after { content: ''; position: absolute; inset: 0; width: 38%; background: linear-gradient(90deg, transparent, var(--info), transparent); animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(380%); } }
.note { margin-top: 14px; font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.note svg { flex: none; margin-top: 3px; }

@media (max-width: 1099px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .srow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 8px; }
  .srow.head { display: none; }
  .srow .c-http { grid-column: 2; grid-row: 1; justify-self: end; }
  .srow .c-rt { grid-column: 1; grid-row: 2; }
  .srow .c-when { grid-column: 1 / -1; grid-row: 3; display: flex; gap: 10px; align-items: baseline; }
  .srow .chev { display: none; }
}
@media (max-width: 520px) {
  .hero-actions { width: 100%; }
  .hero-actions .btn { flex: 1 1 140px; white-space: nowrap; padding: 0 16px; }
  .phead-id { flex-direction: column; align-items: flex-start; gap: 12px; }
  .hero-meta span + span::before { display: none; }
  .hero-meta { gap: 4px 16px; }
  .tiles { grid-template-columns: 1fr; }
  .chart { padding-left: 44px; } .chart .grid-l { left: 44px; } .chart .grid-l span { left: -44px; width: 38px; } .bars, .xlabels { } .bars { left: 44px; } .xlabels { padding-left: 44px; }
  .card-box { padding: 16px; }
}

<script>
/* PROTOTYPE GLUE — not for production. Demo data, permission preview and a simulated scan lifecycle only. */
(function () {
  var params = new URLSearchParams(location.search);
  if (params.get('motion') === 'reduce') document.documentElement.classList.add('reduce-motion');
  var ME_ROLE = ({ owner: 'OWNER', admin: 'ADMIN', member: 'MEMBER' })[params.get('role')] || 'OWNER';
  var state = params.get('state') || 'full';
  var canManage = ME_ROLE === 'OWNER' || ME_ROLE === 'ADMIN';
  var SLOW_MS = 2000;

  var WS = 'MrScraper Platform', PJ = 'Core API';
  var SIDE = ['MrScraper Platform', 'Personal projects', 'Client — Glam by Qody', 'Open-source status pages'];
  var MON = { id: 'm1', targetUrl: 'https://api.example.com/v1/health', intervalSeconds: 300, createdAt: '2026-03-18T14:40:00Z' };

  // seeded history, newest first: [minutesAgo, status, httpStatus, responseTimeMs]
  var SEED = [[4, 'SUCCEEDED', 200, 214], [9, 'SUCCEEDED', 200, 188], [14, 'SUCCEEDED', 200, 236], [19, 'SUCCEEDED', 200, 2410], [24, 'SUCCEEDED', 200, 205], [29, 'FAILED', null, null],
    [34, 'SUCCEEDED', 200, 198], [39, 'SUCCEEDED', 503, 612], [44, 'SUCCEEDED', 200, 221], [49, 'SUCCEEDED', 200, 243], [54, 'SUCCEEDED', 404, 190], [59, 'SUCCEEDED', 200, 207]];
  var scans = state === 'empty' ? [] : SEED.map(function (r, i) { return { id: 's' + (100 - i), status: r[1], httpStatus: r[2], responseTimeMs: r[3], createdAt: new Date(Date.now() - r[0] * 60000).toISOString() }; });
  var filter = 'ALL', runCount = 0;

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtDate(iso) { return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function fmtClock(iso) { return new Date(iso).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }); }
  function rel(iso) {
    var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 45) return 'just now'; var m = Math.round(s / 60); if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60); if (h < 24) return h + ' h ago'; return Math.round(h / 24) + ' d ago';
  }
  function human(sec) { if (sec % 86400 === 0) return sec === 86400 ? 'Every day' : 'Every ' + sec / 86400 + ' days'; if (sec % 3600 === 0) return sec === 3600 ? 'Every hour' : 'Every ' + sec / 3600 + ' hours'; if (sec % 60 === 0) return 'Every ' + sec / 60 + ' min'; return 'Every ' + sec + ' s'; }
  var U = new URL(MON.targetUrl), P = { proto: U.protocol.replace(':', ''), host: U.host, path: (U.pathname === '/' ? '' : U.pathname) + U.search };
  var PLAY = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 3 L12.5 8 L4.5 13 Z" fill="currentColor"/></svg>';
  var GLOBE = '<svg width="28" height="28" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M3 11 H19 M11 3 C8 6 8 16 11 19 C14 16 14 6 11 3 Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  var COPY = '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="7" y="7" width="9.5" height="9.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M13 7 V5.5 A2 2 0 0 0 11 3.5 H5.5 A2 2 0 0 0 3.5 5.5 V11 A2 2 0 0 0 5.5 13 H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  var INFO = '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 9 V14 M10 6.2 V6.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  var LOCK = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3.5" y="8.5" width="13" height="9" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M6.5 8.5 V6.5 a3.5 3.5 0 0 1 7 0 V8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  var ART = '<svg class="art" viewBox="0 0 120 120" fill="none" aria-hidden="true"><circle cx="60" cy="60" r="44" stroke="#2E4039" stroke-width="1.5"/><g class="ring"><circle cx="60" cy="60" r="52" stroke="#93A59C" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="3 9"/><circle cx="60" cy="8" r="3.5" fill="#E8F1EC"/></g><path class="pulse" d="M20 62 H46 L54 40 L66 80 L74 62 H100" stroke="#E8F1EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  $('crumb-ws').textContent = WS; $('crumb-pj').textContent = PJ; $('crumb-name').textContent = P.host;
  $('side-ws').innerHTML = SIDE.map(function (n) { return '<a href="#"' + (n === WS ? ' class="current" aria-current="true"' : '') + '><span class="ws-dot" aria-hidden="true"></span><span class="ws-name">' + esc(n) + '</span></a>'; }).join('');

  var stage = $('stage'), banner = $('banner');
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = '<svg class="ok" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M6.4 10.3 L9 12.8 L13.8 7.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>' + esc(msg) + '</span>';
    $('toasts').appendChild(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 320); }, 3200);
  }

  /* ---------- header + tiles ---------- */
  function header() {
    var actions = canManage ? '<button class="btn" type="button" id="run">' + PLAY + 'Run scan</button>' : '<div class="viewonly">' + LOCK + 'View-only access. Owners and admins run scans.</div>';
    return '<header class="phead rise" style="--i:1"><div class="phead-id"><div class="globebig" aria-hidden="true">' + GLOBE + '</div><div style="min-width:0"><h1 class="murlbig"><span>' + esc(P.host) + '</span><span class="proto">' + P.proto.toUpperCase() + '</span></h1>' +
      '<p class="pathbig">' + (P.path ? esc(P.path) : '/') + '</p></div></div><div class="hero-actions">' + actions + '</div></header>' +
      '<div class="tiles rise" style="--i:2">' +
      '<div class="tile"><div class="tile-k">Target</div><div class="tile-v" title="' + esc(MON.targetUrl) + '" style="padding-right:36px;font-size:15px;white-space:normal;overflow-wrap:anywhere;line-height:1.35">' + esc(MON.targetUrl) + '</div><button class="copy" type="button" id="copy" aria-label="Copy target URL">' + COPY + '</button></div>' +
      '<div class="tile"><div class="tile-k">Interval</div><div class="tile-v">' + human(MON.intervalSeconds) + '</div><div class="tile-s">' + MON.intervalSeconds.toLocaleString('en-US') + ' seconds</div></div>' +
      '<div class="tile"><div class="tile-k">Request</div><div class="tile-v">HTTP GET</div><div class="tile-s">Redirects are not followed</div></div>' +
      '<div class="tile"><div class="tile-k">Added</div><div class="tile-v">' + fmtDate(MON.createdAt) + '</div><div class="tile-s">in ' + esc(PJ) + '</div></div></div>';
  }

  /* ---------- chart ---------- */
  function chart() {
    var done = scans.filter(function (s) { return s.status === 'SUCCEEDED' || s.status === 'FAILED'; }).slice(0, 12).reverse();
    var times = done.map(function (s) { return s.responseTimeMs || 0; });
    var max = Math.max(SLOW_MS * 1.25, Math.max.apply(null, times.concat([0])) * 1.08);
    function y(ms) { return (100 - ms / max * 100) + '%'; }
    var grid = [0, 1000, 2000].map(function (v) { return '<div class="grid-l' + (v === SLOW_MS ? ' slow' : '') + '" style="top:' + y(v) + '"><span>' + (v === 0 ? '0' : (v / 1000) + ' s') + '</span></div>'; }).join('');
    var cols = done.map(function (s, i) {
      var isNew = s.fresh ? ' is-new' : '';
      if (s.status === 'FAILED') return '<div class="bcol' + isNew + '" tabindex="0" role="img" aria-label="Failed scan at ' + fmtClock(s.createdAt) + '"><span class="x" aria-hidden="true">×</span><span class="tip">' + fmtClock(s.createdAt) + ' · failed</span></div>';
      var slow = s.responseTimeMs >= SLOW_MS;
      return '<div class="bcol' + isNew + '" tabindex="0" role="img" aria-label="' + s.responseTimeMs + ' milliseconds at ' + fmtClock(s.createdAt) + (slow ? ', slow' : '') + '"><div class="b' + (slow ? ' slow' : '') + '" style="--i:' + i + ';height:' + (s.responseTimeMs / max * 100) + '%"></div><span class="tip">' + fmtClock(s.createdAt) + ' · ' + s.responseTimeMs.toLocaleString('en-US') + ' ms' + (s.httpStatus ? ' · ' + s.httpStatus : '') + '</span></div>';
    }).join('');
    var labels = done.map(function (s) { return '<span>' + fmtClock(s.createdAt) + '</span>'; }).join('');
    return '<section class="card-box rise" style="--i:3" aria-labelledby="chart-h"><div class="card-box-head"><div><h2 id="chart-h">Response time</h2><p>Last ' + done.length + ' finished scans, oldest to newest</p></div>' +
      '<div class="legend"><span><i></i>Normal</span><span><i class="slow"></i>Slow (' + SLOW_MS.toLocaleString('en-US') + ' ms or more)</span><span><i class="fail"></i>Failed</span></div></div>' +
      '<div class="chart" id="chart">' + grid + '<div class="bars">' + cols + '</div></div><div class="xlabels" aria-hidden="true">' + (window.innerWidth > 640 ? labels : '') + '</div></section>';
  }
  function renderChart() { var host = $('chart-host'); if (host) host.innerHTML = scans.length ? chart() : ''; }

  /* ---------- history ---------- */
  var CHIP = { QUEUED: ['queued', 'Queued'], RUNNING: ['running', 'Running'], SUCCEEDED: ['succeeded', 'Succeeded'], FAILED: ['failed', 'Failed'] };
  function row(s) {
    var c = CHIP[s.status], busy = s.status === 'QUEUED' || s.status === 'RUNNING';
    var http = s.httpStatus ? '<span class="http ' + (s.httpStatus >= 500 ? 'c5' : s.httpStatus >= 400 ? 'c4' : '') + '">' + s.httpStatus + '</span>' : '<span class="http none">' + (busy ? 'pending' : 'no response') + '</span>';
    var rt = s.responseTimeMs == null ? '<span class="rt none">—</span>' : '<span class="rt' + (s.responseTimeMs >= SLOW_MS ? ' slow' : '') + '">' + s.responseTimeMs.toLocaleString('en-US') + ' ms</span>';
    return '<div class="srow' + (busy ? ' busy' : '') + (s.fresh ? ' new' : '') + '" id="scan-' + s.id + '"><span class="c-chip"><span class="chip-s ' + c[0] + '"><i></i>' + c[1] + '</span></span><span class="c-http">' + http + '</span><span class="c-rt">' + rt + '</span>' +
      '<span class="c-when"><span class="when-rel">' + rel(s.createdAt) + '</span> <span class="when-abs">' + fmtDate(s.createdAt) + ', ' + fmtClock(s.createdAt) + '</span></span><span class="chev" aria-hidden="true">→</span><div class="bar" aria-hidden="true"></div>' +
      '<a class="stretch" href="#" aria-label="Open scan from ' + fmtDate(s.createdAt) + ' ' + fmtClock(s.createdAt) + ', ' + c[1].toLowerCase() + '"></a></div>';
  }
  function renderHistory() {
    var host = $('hist'); if (!host) return;
    var list = scans.filter(function (s) { return filter === 'ALL' || (filter === 'FAILED' ? s.status === 'FAILED' : filter === 'SUCCEEDED' ? s.status === 'SUCCEEDED' : false); });
    document.querySelectorAll('#chips .chip').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.f === filter)); var n = b.querySelector('.n'); n.textContent = b.dataset.f === 'ALL' ? scans.length : scans.filter(function (s) { return s.status === b.dataset.f; }).length; });
    if (!scans.length) {
      host.innerHTML = '<div class="panel">' + ART + '<h2>No scans yet</h2><p>' + (canManage ? 'Run the first scan to see its status, HTTP code and response time here.' : 'An owner or admin needs to run the first scan.') + '</p>' + (canManage ? '<div class="btns"><button class="btn" type="button" id="run2">' + PLAY + 'Run scan</button></div>' : '') + '</div>';
      var r2 = $('run2'); if (r2) r2.addEventListener('click', runScan); return;
    }
    if (!list.length) { host.innerHTML = '<div class="panel"><h2>No ' + filter.toLowerCase() + ' scans</h2><p>Nothing in the recent scans matches this filter.</p></div>'; return; }
    host.innerHTML = '<div class="scans" role="table" aria-label="Scan history"><div class="srow head" role="row"><span>Status</span><span>HTTP</span><span>Response</span><span>When</span><span></span></div>' + list.map(row).join('') + '</div>' +
      '<p class="note">' + INFO + '<span>Succeeded means the target answered. A 4xx or 5xx response is still Succeeded and creates findings; Failed means a timeout, DNS or connection error. Only recent scans are listed.</span></p>';
  }

  /* simulated lifecycle: POST /scans (202 QUEUED) -> poll GET /scans/:id */
  function runScan() {
    runCount++;
    var s = { id: 's' + Date.now(), status: 'QUEUED', httpStatus: null, responseTimeMs: null, createdAt: new Date().toISOString(), fresh: true };
    scans.unshift(s); filter = 'ALL'; renderHistory(); renderChart(); setRun(true); toast('Scan queued for ' + P.host + '.');
    setTimeout(function () { s.status = 'RUNNING'; renderHistory(); }, 1100);
    setTimeout(function () {
      if (runCount % 3 === 0) { s.status = 'FAILED'; }
      else { s.status = 'SUCCEEDED'; s.httpStatus = 200; s.responseTimeMs = 180 + Math.floor(Math.random() * 160); }
      renderHistory(); renderChart(); setRun(false);
      toast(s.status === 'FAILED' ? 'Scan failed: the target did not respond in time.' : 'Scan finished: HTTP ' + s.httpStatus + ' in ' + s.responseTimeMs + ' ms.');
      setTimeout(function () { s.fresh = false; }, 2000);
    }, 3000);
  }
  function setRun(busy) { var b = $('run'); if (b) { b.disabled = busy; b.lastChild.textContent = busy ? 'Scanning…' : 'Run scan'; } }

  /* ---------- states ---------- */
  function showFull() {
    stage.innerHTML = header() + '<div id="chart-host"></div>' +
      '<div class="hist-head rise" style="--i:4"><div><h2>Scan history</h2><p>Open a scan to see its findings.</p></div><div class="chips" role="group" aria-label="Filter scans" id="chips">' +
      [['ALL', 'All'], ['SUCCEEDED', 'Succeeded'], ['FAILED', 'Failed']].map(function (f) { return '<button class="chip" type="button" data-f="' + f[0] + '" aria-pressed="false">' + f[1] + '<span class="n"></span></button>'; }).join('') + '</div></div><div id="hist" class="rise" style="--i:5"></div>';
    renderChart(); renderHistory();
    $('chips').addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (!b) return; filter = b.dataset.f; renderHistory(); });
    var r = $('run'); if (r) r.addEventListener('click', runScan);
    $('copy').addEventListener('click', function () { try { navigator.clipboard.writeText(MON.targetUrl); } catch (e) {} toast('Target URL copied.'); });
  }
  function showLoading() {
    stage.innerHTML = '<div class="phead" aria-busy="true"><div class="skel" style="min-height:0;border:0;background:none;padding:0;width:min(460px,100%)"><i class="a" style="width:64px;height:64px;border-radius:20px"></i><i class="b"></i><i class="c"></i></div></div><div class="tiles">' + [0, 1, 2, 3].map(function () { return '<div class="skel" style="min-height:86px"><i class="c"></i><i class="b" style="margin-top:0"></i></div>'; }).join('') + '</div><div class="skel" style="min-height:240px;margin-top:26px"></div>';
  }
  function showError() {
    banner.hidden = false;
    banner.innerHTML = '<div class="banner" role="alert"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 6 V11 M10 13.6 V14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><div><strong>Couldn’t load this monitor.</strong><small>Request ID: req-demo-71cd</small></div><button class="btn btn-ghost" type="button" id="retry">Try again</button></div>';
    $('retry').addEventListener('click', function () { var p = new URLSearchParams(location.search); p.delete('state'); location.search = p.toString(); });
  }
  function showNotFound() { stage.innerHTML = '<div class="panel">' + ART + '<h2>Monitor not found</h2><p>It may not exist, or you may not be a member of this workspace.</p><div class="btns"><a class="btn" href="#">Back to project</a></div></div>'; }
  if (state === 'loading') showLoading(); else if (state === 'error') showError(); else if (state === 'notfound') showNotFound(); else showFull();

  var app = $('app'), menu = $('menu-btn');
  function setNav(open) { app.classList.toggle('nav-open', open); menu.setAttribute('aria-expanded', String(open)); if (open) $('sidebar').querySelector('a').focus(); else menu.focus(); }
  menu.addEventListener('click', function () { setNav(true); });
  $('scrim').addEventListener('click', function () { setNav(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && app.classList.contains('nav-open')) setNav(false); });
  document.addEventListener('click', function (e) { var a = e.target.closest('a[href="#"]'); if (a) e.preventDefault(); });
})();
</script>
</body>
</html>
