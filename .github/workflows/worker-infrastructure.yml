name: Worker infrastructure

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      API_PORT: "3001"
      POSTGRES_USER: ontapulse
      POSTGRES_PASSWORD: ontapulse-test
      POSTGRES_DB: ontapulse_test
      POSTGRES_PORT: "5433"
      DATABASE_URL: postgresql://ontapulse:ontapulse-test@127.0.0.1:5433/ontapulse_test
      REDIS_PORT: "6379"
      REDIS_URL: redis://127.0.0.1:6379
      RABBITMQ_USER: ontapulse
      RABBITMQ_PASSWORD: ontapulse-test
      RABBITMQ_PORT: "5672"
      RABBITMQ_MANAGEMENT_PORT: "15672"
      RABBITMQ_URL: amqp://ontapulse:ontapulse-test@127.0.0.1:5672
      WORKER_INFRA_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.8.12
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm --filter @ontapulse/api test:db:migrate
      - run: uv sync --locked --link-mode=copy
        working-directory: apps/worker
      - run: uv run --locked --no-sync pytest -m integration -v
        working-directory: apps/worker
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
