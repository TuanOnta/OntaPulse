<html lang="en">
<head>
<meta charset="utf-8">

<title>OntaPulse — Dashboard (reference prototype)</title>
<meta name="color-scheme" content="dark">

<!--
  REFERENCE PROTOTYPE — /dashboard
  Not production code. Port into apps/web per AGENTS.md; do not ship this file.

  Scope (README, "Web client"): /dashboard is an overview of the user's workspaces.
  Data source: GET /api/workspaces only. Each item here uses: id, name, role, createdAt.
  The API has NO uptime, SLA, incident or response-time aggregates (README, "Current
  limitations"), so this screen shows none. Summary counts are derived from the list.

  Sample data below is demo content only.

  Query flags (prototype only, remove in the port):
    ?state=full | loading | empty | error      default: full
    ?motion=reduce                              disables animation

  App shell (sidebar + topbar) is reused by every later app screen
  (workspace, project, monitor, scan). Build it once in widgets/app-shell.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0A0E0D;
  --bg-2: #0D1311;
  --surface: #111715;
  --surface-2: #17201C;
  --border: #22302B;
  --border-strong: #2E4039;
  --text: #E8F1EC;
  --text-2: #B6C6BE;
  --muted: #93A59C;
  --accent: #5EF2A0;
  --accent-ink: #04140C;
  --info: #7CC4FF;
  --warn: #FFB454;
  --danger: #FF7A6B;
  --danger-text: #FF9A8D;
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --sidebar-w: 264px;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
p { margin: 0; }
[hidden] { display: none !important; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Ambient background ---------- */
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.ambient::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(232,241,236,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,241,236,.035) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 70% 0%, #000 0%, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 60% at 70% 0%, #000 0%, transparent 75%);
}
.ambient::after {
  content: ''; position: absolute; width: 900px; height: 900px; right: -200px; top: -460px;
  background: radial-gradient(circle, rgba(124,196,255,.07), transparent 62%);
  animation: drift 14s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate3d(-80px, 40px, 0) scale(1.08); } }

/* ---------- Layout ---------- */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100svh; }

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky; top: 0; height: 100svh; display: flex; flex-direction: column; gap: 22px;
  padding: 18px 16px; background: rgba(13,19,17,.82); border-right: 1px solid var(--border);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.logo { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px; font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-label { padding: 0 12px; margin: 4px 0 2px; font: 500 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nav a {
  position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px;
  border-radius: 12px; color: var(--text-2); font-size: 16px; font-weight: 500;
  transition: background .2s, color .2s;
}
.nav a svg { flex: none; opacity: .85; }
.nav a:hover { background: var(--surface); color: var(--text); }
.nav a[aria-current="page"] { background: var(--surface-2); color: var(--text); }
.nav a[aria-current="page"]::before {
  content: ''; position: absolute; left: -16px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0;
  background: var(--accent); box-shadow: 0 0 12px var(--accent);
}
.nav .ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); flex: none; margin: 0 5px; }
.nav a:hover .ws-dot { background: var(--text-2); }
.nav .ws-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
.nav-empty { padding: 8px 12px; font-size: 15px; color: var(--muted); }

.user { border-top: 1px solid var(--border); padding-top: 14px; display: flex; align-items: center; gap: 12px; }
.avatar {
  flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--surface-2), var(--border-strong)); border: 1px solid var(--border-strong);
  font: 700 15px var(--font-display);
}
.user-meta { min-width: 0; flex: 1; line-height: 1.25; }
.user-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-mail { font: 400 13px var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 1px solid transparent;
  border-radius: 12px; color: var(--muted); cursor: pointer; transition: background .2s, color .2s, border-color .2s;
}
.icon-btn:hover { background: var(--surface); color: var(--text); border-color: var(--border); }

/* ---------- Main ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.mobilebar { display: none; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: rgba(10,14,13,.85); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20; }
.content { width: 100%; max-width: 1160px; margin: 0 auto; padding: 44px 40px 72px; }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; }
.eyebrow { font: 500 13px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 10px; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(94,242,160,.6); animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(94,242,160,.55); } 70%,100% { box-shadow: 0 0 0 10px rgba(94,242,160,0); } }
h1 { font-size: clamp(32px, 4vw, 46px); line-height: 1.08; letter-spacing: -.02em; margin-top: 10px; }
.sub { margin-top: 8px; color: var(--muted); font-size: 17px; max-width: 52ch; }

.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font: 600 16px var(--font-body);
  transition: transform .15s, box-shadow .25s;
}
.btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%); transform: translateX(-120%); }
.btn:hover { box-shadow: 0 0 0 4px rgba(94,242,160,.12), 0 8px 22px -10px rgba(94,242,160,.4); }
.btn:hover::after { transform: translateX(120%); transition: transform .7s ease; }
.btn:active { transform: scale(.98); }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border-strong); }
.btn-ghost::after { display: none; }
.btn-ghost:hover { background: var(--surface); box-shadow: none; }

/* heartbeat divider */
.trace { position: relative; height: 22px; margin: 28px 0 24px; }
.trace svg { width: 100%; height: 22px; display: block; overflow: visible; }
.trace .line { stroke: var(--border-strong); stroke-width: 1.2; fill: none; vector-effect: non-scaling-stroke; }
.trace .beam { stroke: var(--text-2); stroke-width: 1.6; fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 90 1200; stroke-dashoffset: 90; animation: travel 5.5s linear infinite; filter: drop-shadow(0 0 3px rgba(232,241,236,.5)); }
@keyframes travel { to { stroke-dashoffset: -1200; } }

/* summary stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stat { position: relative; padding: 18px 20px; background: rgba(17,23,21,.72); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
.stat::before { content: ''; position: absolute; left: 0; top: 0; height: 2px; width: var(--w, 40%); background: linear-gradient(90deg, var(--c, var(--accent)), transparent); }
.stat-k { font: 500 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat-v { margin-top: 6px; font: 700 38px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin: 30px 0 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 0 16px; border-radius: 999px; background: transparent; border: 1px solid var(--border);
  color: var(--text-2); font-size: 15px; font-weight: 500; cursor: pointer; transition: background .2s, color .2s, border-color .2s;
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--surface-2); border-color: var(--muted); color: var(--text); }
.chip .n { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin-left: 6px; }
.search { position: relative; flex: 1 1 260px; max-width: 340px; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; min-height: 44px; padding: 0 14px 0 42px; background: rgba(10,14,13,.7); border: 1px solid var(--border);
  border-radius: 14px; color: var(--text); font: 400 16px var(--font-body); transition: border-color .2s, box-shadow .2s;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--text-2); box-shadow: 0 0 0 4px rgba(232,241,236,.08); }

/* ---------- Workspace cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card {
  --mx: 50%; --my: 0%;
  position: relative; display: flex; flex-direction: column; gap: 18px; min-height: 176px; padding: 22px;
  background: rgba(17,23,21,.78); border: 1px solid var(--border); border-radius: 22px; overflow: hidden;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .35s;
}
.card::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(260px circle at var(--mx) var(--my), rgba(232,241,236,.07), transparent 70%);
}
.card:hover { transform: translateY(-4px); border-color: var(--border-strong); box-shadow: 0 24px 50px -24px rgba(0,0,0,.8); }
.card:hover::before { opacity: 1; }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.mark {
  flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--surface-2), var(--bg-2)); border: 1px solid var(--border-strong);
  font: 700 19px var(--font-display); color: var(--text);
}
.role { font: 500 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid currentColor; }
.role.owner { color: var(--text); background: rgba(232,241,236,.06); }
.role.admin { color: var(--info); background: rgba(124,196,255,.08); }
.role.member { color: var(--muted); background: rgba(147,165,156,.06); }
.card h3 { font-size: 22px; line-height: 1.2; letter-spacing: -.01em; overflow-wrap: anywhere; }
.card-meta { margin-top: 4px; font: 400 14px var(--font-mono); color: var(--muted); }
.card-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; color: var(--text-2); font-size: 15px; font-weight: 500; }
.card-foot .arrow { display: inline-block; transition: transform .3s cubic-bezier(.2,.8,.2,1), color .3s; color: var(--muted); }
.card:hover .arrow { color: var(--accent); }
.card:hover .arrow { transform: translateX(6px); }
.card > a.stretch { position: absolute; inset: 0; z-index: 2; border-radius: inherit; }
.card > a.stretch:focus-visible { outline-offset: -3px; }

.card.create { border-style: dashed; border-color: var(--border-strong); background: transparent; align-items: center; justify-content: center; text-align: center; gap: 10px; color: var(--text-2); }
.card.create .plus {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; border: 1px dashed var(--muted); color: var(--text-2);
  transition: transform .5s cubic-bezier(.2,.8,.2,1), background .3s;
}
.card.create:hover .plus { transform: rotate(90deg); border-color: var(--accent); color: var(--accent); }
.card.create strong { font: 700 19px var(--font-display); color: var(--text); }
.card.create span { font-size: 15px; color: var(--muted); }


/* ---------- Workspace card v2 (generative banner) ---------- */
@property --angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.grid { perspective: 1200px; }
.card {
  --t: 124,196,255; --rx: 0deg; --ry: 0deg;
  padding: 0; gap: 0; min-height: 0;
  transform: rotateX(var(--rx)) rotateY(var(--ry));
  transform-style: preserve-3d;
  transition: transform .25s ease-out, border-color .3s, box-shadow .35s;
}
.card.tone-1 { --t: 232,241,236; }
.card.tone-2 { --t: 255,180,84; }
.card.tone-3 { --t: 94,242,160; }
.card:hover { transform: translateY(-4px) rotateX(var(--rx)) rotateY(var(--ry)); border-color: rgba(var(--t), .35); box-shadow: 0 28px 56px -26px rgba(0,0,0,.85), 0 0 40px -14px rgba(var(--t), .35); }
.card::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: conic-gradient(from var(--angle), transparent 0 62%, rgba(var(--t), .95) 80%, transparent 96%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  animation: spin-angle 4s linear infinite;
}
.card:hover::after { opacity: 1; }
@keyframes spin-angle { to { --angle: 360deg; } }

.cover {
  position: relative; height: 104px; overflow: hidden; border-bottom: 1px solid var(--border);
  background:
    radial-gradient(120% 140% at 15% 0%, rgba(var(--t), .20), transparent 60%),
    linear-gradient(180deg, rgba(var(--t), .06), transparent);
}
.cover::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(var(--t), .28) 1px, transparent 1.2px); background-size: 14px 14px;
  -webkit-mask-image: linear-gradient(180deg, #000, transparent 85%); mask-image: linear-gradient(180deg, #000, transparent 85%);
  transition: background-position .8s ease-out;
}
.card:hover .cover::before { background-position: 14px 7px; }
.cover svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 72px; display: block; }
.cover .fill { fill: url(#none); }
.cover .wave { fill: none; stroke: rgba(var(--t), .75); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.cover .glow { fill: none; stroke: rgb(var(--t)); stroke-width: 2.4; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 60 1000; stroke-dashoffset: 60; animation: wave-travel 5s linear infinite; filter: drop-shadow(0 0 5px rgb(var(--t))); animation-delay: var(--d, 0s); }
.card:hover .cover .glow { animation-duration: 2.2s; }
@keyframes wave-travel { to { stroke-dashoffset: -1000; } }
.cover .role { position: absolute; top: 14px; right: 14px; z-index: 1; display: inline-flex; align-items: center; gap: 6px; background: rgba(10,14,13,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.cover .role svg { position: static; width: 12px; height: 12px; }
.body { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 0 22px 20px; flex: 1; }
.body .mark { margin-top: -26px; width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(145deg, rgba(var(--t), .22), var(--bg-2)); border: 1px solid rgba(var(--t), .45); box-shadow: 0 10px 24px -10px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08); transform: translateZ(24px); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.card:hover .body .mark { transform: translateZ(24px) scale(1.06) rotate(-3deg); }
.card-foot { padding-top: 14px; border-top: 1px solid var(--border); }
.card-meta { display: flex; align-items: center; gap: 8px; }
.card-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); }
.card.create { min-height: 260px; }
.card.create::after { display: none; }
@media (prefers-reduced-motion: reduce) { .card { transform: none !important; } }
html.reduce-motion .card { transform: none !important; }

/* entrance */
.rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- Skeleton ---------- */
.skel { min-height: 176px; border-radius: 22px; border: 1px solid var(--border); background: rgba(17,23,21,.6); position: relative; overflow: hidden; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.skel i { display: block; border-radius: 8px; background: var(--surface-2); }
.skel .a { width: 46px; height: 46px; border-radius: 14px; }
.skel .b { width: 62%; height: 20px; margin-top: 8px; }
.skel .c { width: 38%; height: 14px; }
.skel::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(232,241,236,.05) 50%, transparent 70%); transform: translateX(-100%); animation: sheen 1.5s ease-in-out infinite; }
@keyframes sheen { to { transform: translateX(100%); } }

/* ---------- Empty / error / no-results ---------- */
.panel { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 64px 24px; border: 1px dashed var(--border-strong); border-radius: 26px; background: rgba(17,23,21,.5); }
.panel h2 { font-size: 28px; letter-spacing: -.01em; }
.panel p { color: var(--muted); max-width: 46ch; }
.panel .btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 10px; }
.panel .art { width: 120px; height: 120px; margin-bottom: 6px; }
.art .ring { transform-origin: 60px 60px; animation: spin 18s linear infinite; }
.art .pulse { stroke-dasharray: 140; stroke-dashoffset: 140; animation: draw 3s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes draw { 0% { stroke-dashoffset: 140; } 55%,100% { stroke-dashoffset: 0; } }

.banner { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; border-radius: 16px; border: 1px solid rgba(255,122,107,.45); background: rgba(255,122,107,.07); color: var(--danger-text); animation: drop .5s cubic-bezier(.2,.8,.2,1) both; }
.banner strong { display: block; font-weight: 600; font-size: 17px; }
.banner small { display: block; margin-top: 2px; font: 400 13px var(--font-mono); color: var(--muted); }
.banner .btn { margin-left: auto; min-height: 40px; padding: 0 18px; font-size: 15px; }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

/* ---------- Mobile drawer ---------- */
.scrim { display: none; }
@media (max-width: 959px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; z-index: 40; left: 0; top: 0; width: min(300px, 86vw); transform: translateX(-102%);
    transition: transform .35s cubic-bezier(.2,.8,.2,1); background: rgba(10,14,13,.97);
  }
  .nav-open .sidebar { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .nav-open .scrim { opacity: 1; pointer-events: auto; }
  .mobilebar { display: flex; }
  .content { padding: 28px 16px 56px; }
  .stats { grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stat { padding: 14px; }
  .stat-v { font-size: 30px; }
  .stat-k { font-size: 11px; }
}
@media (max-width: 520px) {
  .head .btn { width: 100%; }
  .search { max-width: none; flex-basis: 100%; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .banner { flex-wrap: wrap; }
  .banner .btn { margin-left: 0; width: 100%; }
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <a class="logo" href="#">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#5EF2A0" stroke-width="1.5" stroke-opacity=".5"/><path d="M3 16 H10 L13 8 L17 23 L20 16 H27" fill="none" stroke="#5EF2A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      OntaPulse
    </a>

    <nav class="nav" aria-label="Main">
      <a href="#" aria-current="page">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1.8" stroke="currentColor" stroke-width="1.5"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.8" stroke="currentColor" stroke-width="1.5"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.8" stroke="currentColor" stroke-width="1.5"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.8" stroke="currentColor" stroke-width="1.5"/></svg>
        Dashboard
      </a>
      <a href="#">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4 V16 M4 10 H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        New workspace
      </a>
    </nav>

    <div class="nav" style="min-height:0;flex:1">
      <div class="nav-label">Workspaces</div>
      <div class="nav-scroll" id="side-ws"></div>
    </div>

    <div class="user">
      <div class="avatar" id="avatar" aria-hidden="true">DA</div>
      <div class="user-meta">
        <div class="user-name" id="user-name">Dzaki Arta</div>
        <div class="user-mail" id="user-mail">dzaki@example.com</div>
      </div>
      <button class="icon-btn" type="button" aria-label="Sign out" title="Sign out">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M8 3.5 H5.5 A2 2 0 0 0 3.5 5.5 V14.5 A2 2 0 0 0 5.5 16.5 H8 M12.5 6.5 L16 10 L12.5 13.5 M16 10 H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="mobilebar">
      <button class="icon-btn" type="button" id="menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M3.5 6 H18.5 M3.5 11 H18.5 M3.5 16 H18.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <a class="logo" href="#" style="font-size:20px">
        <svg width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#5EF2A0" stroke-width="1.5" stroke-opacity=".5"/><path d="M3 16 H10 L13 8 L17 23 L20 16 H27" fill="none" stroke="#5EF2A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        OntaPulse
      </a>
      <span style="width:44px"></span>
    </div>

    <main class="content" id="content">
      <header class="head rise" style="--i:0">
        <div>
          <span class="eyebrow"><span class="live" aria-hidden="true"></span>Dashboard</span>
          <h1 id="greeting">Welcome back, Dzaki</h1>
          <p class="sub">Your workspaces. Open one to manage its projects, monitors and members.</p>
        </div>
        <a class="btn" href="#">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4 V16 M4 10 H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          New workspace
        </a>
      </header>

      <div class="trace rise" style="--i:1" aria-hidden="true">
        <svg viewBox="0 0 1000 22" preserveAspectRatio="none">
          <path class="line" d="M0 11 H430 L446 11 L458 3 L474 19 L488 11 H1000"/>
          <path class="beam" d="M0 11 H430 L446 11 L458 3 L474 19 L488 11 H1000"/>
        </svg>
      </div>

      <div id="banner" hidden></div>
      <div id="stats" class="stats rise" style="--i:2" hidden></div>
      <div id="toolbar" class="toolbar rise" style="--i:3" hidden>
        <div class="chips" role="group" aria-label="Filter by role" id="chips"></div>
        <label class="search">
          <span class="sr-only">Search workspaces</span>
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 13.5 L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search workspaces" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
</div>

<script>
/* PROTOTYPE GLUE — not for production. Demo data + view switching only. */
(function () {
  var params = new URLSearchParams(location.search);
  if (params.get('motion') === 'reduce') document.documentElement.classList.add('reduce-motion');
  var motionOK = !document.documentElement.classList.contains('reduce-motion') && !matchMedia('(prefers-reduced-motion: reduce)').matches;

  var USER = { name: 'Dzaki Arta', email: 'dzaki@example.com' };
  var WORKSPACES = [
    { id: 'w1', name: 'MrScraper Platform', role: 'OWNER',  createdAt: '2026-03-04T08:12:00Z' },
    { id: 'w2', name: 'Personal projects',   role: 'OWNER',  createdAt: '2026-04-19T13:40:00Z' },
    { id: 'w3', name: 'Client — Glam by Qody', role: 'ADMIN', createdAt: '2026-06-02T02:05:00Z' },
    { id: 'w4', name: 'Open-source status pages', role: 'MEMBER', createdAt: '2026-08-27T17:31:00Z' }
  ];

  var state = params.get('state') || 'full';
  var data = state === 'empty' ? [] : WORKSPACES.slice();
  var filter = 'ALL', query = '';

  var $ = function (id) { return document.getElementById(id); };
  var view = $('view'), banner = $('banner'), stats = $('stats'), toolbar = $('toolbar'), chips = $('chips');

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtDate(iso) { return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function initials(n) { return n.split(/\s+/).filter(function (w) { return /[A-Za-z0-9]/.test(w[0]); }).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase(); }
  function cap(r) { return r.charAt(0) + r.slice(1).toLowerCase(); }
  var PLUS = '<svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4 V16 M4 10 H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

  /* user + greeting */
  $('user-name').textContent = USER.name; $('user-mail').textContent = USER.email; $('avatar').textContent = initials(USER.name);
  $('greeting').textContent = 'Welcome back, ' + USER.name.split(' ')[0];

  /* sidebar workspace list */
  function renderSide() {
    var el = $('side-ws');
    if (!data.length) { el.innerHTML = '<p class="nav-empty">No workspaces yet.</p>'; return; }
    el.innerHTML = data.map(function (w) {
      return '<a href="#"><span class="ws-dot" aria-hidden="true"></span><span class="ws-name">' + esc(w.name) + '</span></a>';
    }).join('');
  }

  function renderStats() {
    var owned = data.filter(function (w) { return w.role === 'OWNER'; }).length;
    stats.innerHTML =
      stat('Workspaces', data.length, '100%', 'var(--text-2)') +
      stat('You own', owned, (data.length ? owned / data.length * 100 : 0) + '%', 'var(--info)') +
      stat('Shared with you', data.length - owned, (data.length ? (data.length - owned) / data.length * 100 : 0) + '%', 'var(--warn)');
    stats.querySelectorAll('[data-count]').forEach(function (el) { countUp(el, +el.dataset.count); });
  }
  function stat(k, v, w, c) {
    return '<div class="stat" style="--w:' + w + ';--c:' + c + '"><div class="stat-k">' + k + '</div><div class="stat-v" data-count="' + v + '">' + v + '</div></div>';
  }
  function countUp(el, to) {
    if (!motionOK || to === 0) return;
    var t0 = performance.now(), dur = 700;
    (function step(t) {
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * e);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  function renderChips() {
    var counts = { ALL: data.length, OWNER: 0, ADMIN: 0, MEMBER: 0 };
    data.forEach(function (w) { counts[w.role]++; });
    chips.innerHTML = ['ALL', 'OWNER', 'ADMIN', 'MEMBER'].map(function (r) {
      return '<button class="chip" type="button" data-r="' + r + '" aria-pressed="' + (filter === r) + '">' + (r === 'ALL' ? 'All' : cap(r)) + '<span class="n">' + counts[r] + '</span></button>';
    }).join('');
  }

  /* deterministic hash -> tone + waveform, so each workspace keeps its own look */
  function hash(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { var a = seed; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function wavePath(seed) {
    var r = rng(seed), pts = [], n = 14, x;
    for (var i = 0; i <= n; i++) { x = i / n * 400; pts.push([x, 36 + (r() - .5) * 46 * (i % 4 === 2 ? 1.5 : .8)]); }
    var d = 'M' + pts[0][0] + ' ' + pts[0][1].toFixed(1);
    for (var j = 1; j < pts.length; j++) {
      var cx = (pts[j - 1][0] + pts[j][0]) / 2;
      d += ' C' + cx + ' ' + pts[j - 1][1].toFixed(1) + ' ' + cx + ' ' + pts[j][1].toFixed(1) + ' ' + pts[j][0] + ' ' + pts[j][1].toFixed(1);
    }
    return d;
  }
  var ROLE_ICON = {
    OWNER: '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M1.5 9 L1 3.5 L4 6 L6 2.5 L8 6 L11 3.5 L10.5 9 Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>',
    ADMIN: '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 1.2 L10.2 2.8 V6 C10.2 8.4 8.4 10 6 10.8 C3.6 10 1.8 8.4 1.8 6 V2.8 Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>',
    MEMBER: '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="4" r="2.1" stroke="currentColor" stroke-width="1.1"/><path d="M2 10.4 C2.5 8.4 4 7.6 6 7.6 S9.5 8.4 10 10.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>'
  };
  function ago(iso) {
    var days = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000));
    if (days < 1) return 'today'; if (days < 30) return days + 'd ago';
    var m = Math.floor(days / 30); if (m < 12) return m + ' mo ago';
    return Math.floor(m / 12) + ' yr ago';
  }
  function card(w, i) {
    var h = hash(w.id + w.name), tone = h % 4, d = wavePath(h), delay = -((h % 50) / 10);
    return '<article class="card tone-' + tone + ' rise" style="--i:' + (i + 4) + '">' +
      '<div class="cover" aria-hidden="true"><span class="role ' + w.role.toLowerCase() + '">' + ROLE_ICON[w.role] + w.role + '</span>' +
      '<svg viewBox="0 0 400 72" preserveAspectRatio="none"><path class="wave" d="' + d + '"/><path class="glow" style="--d:' + delay + 's" d="' + d + '"/></svg></div>' +
      '<div class="body"><div class="mark" aria-hidden="true">' + esc(initials(w.name) || 'W') + '</div>' +
      '<div><h3>' + esc(w.name) + '</h3><p class="card-meta"><span>Created ' + fmtDate(w.createdAt) + '</span><span class="dot"></span><span>' + ago(w.createdAt) + '</span></p></div>' +
      '<div class="card-foot"><span>Open workspace <span class="sr-only">(' + w.role.toLowerCase() + ')</span></span><span class="arrow" aria-hidden="true">→</span></div></div>' +
      '<a class="stretch" href="#" aria-label="Open workspace ' + esc(w.name) + '"></a></article>';
  }
  var CREATE = function (i) {
    return '<article class="card create rise" style="--i:' + i + '"><div class="plus">' + PLUS + '</div><strong>Create workspace</strong><span>Invite teammates and start monitoring.</span><a class="stretch" href="#" aria-label="Create a new workspace"></a></article>';
  };

  var ART = '<svg class="art" viewBox="0 0 120 120" fill="none" aria-hidden="true"><circle cx="60" cy="60" r="44" stroke="#2E4039" stroke-width="1.5"/><g class="ring"><circle cx="60" cy="60" r="52" stroke="#5EF2A0" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="3 9"/><circle cx="60" cy="8" r="3.5" fill="#5EF2A0"/></g><path class="pulse" d="M20 62 H46 L54 40 L66 80 L74 62 H100" stroke="#5EF2A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderGrid() {
    var list = data.filter(function (w) {
      return (filter === 'ALL' || w.role === filter) && w.name.toLowerCase().indexOf(query.toLowerCase()) !== -1;
    });
    if (!list.length) {
      view.innerHTML = '<div class="panel">' + ART + '<h2>No matching workspaces</h2><p>Nothing matches “' + esc(query || cap(filter)) + '”. Try another search or clear the filter.</p><div class="btns"><button class="btn btn-ghost" type="button" id="clear">Clear filters</button></div></div>';
      $('clear').addEventListener('click', function () { filter = 'ALL'; query = ''; $('q').value = ''; renderChips(); renderGrid(); });
      return;
    }
    view.innerHTML = '<div class="grid">' + list.map(card).join('') + (filter === 'ALL' && !query ? CREATE(list.length + 4) : '') + '</div>';
    bindSpotlight();
  }

  function bindSpotlight() {
    if (!motionOK) return;
    view.querySelectorAll('.card').forEach(function (c) {
      c.addEventListener('pointermove', function (e) {
        var r = c.getBoundingClientRect();
        c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        c.style.setProperty('--my', (e.clientY - r.top) + 'px');
        c.style.setProperty('--ry', (((e.clientX - r.left) / r.width - .5) * 6).toFixed(2) + 'deg');
        c.style.setProperty('--rx', ((.5 - (e.clientY - r.top) / r.height) * 5).toFixed(2) + 'deg');
      });
      c.addEventListener('pointerleave', function () { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); });
    });
  }

  /* states */
  function showLoading() {
    view.innerHTML = '<div class="grid" aria-busy="true">' + [0, 1, 2, 3].map(function () { return '<div class="skel"><i class="a"></i><i class="b"></i><i class="c"></i></div>'; }).join('') + '</div>';
    stats.hidden = true; toolbar.hidden = true;
    $('side-ws').innerHTML = '<p class="nav-empty">Loading…</p>';
  }
  function showError() {
    stats.hidden = true; toolbar.hidden = true;
    banner.hidden = false;
    banner.innerHTML = '<div class="banner" role="alert"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 6 V11 M10 13.6 V14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><div><strong>Couldn’t load your workspaces.</strong><small>Request ID: req-demo-9c21</small></div><button class="btn btn-ghost" type="button" id="retry">Try again</button></div>';
    view.innerHTML = '';
    $('side-ws').innerHTML = '<p class="nav-empty">Unavailable.</p>';
    $('retry').addEventListener('click', function () { var p = new URLSearchParams(location.search); p.set('state', 'full'); location.search = p.toString(); });
  }
  function showEmpty() {
    stats.hidden = true; toolbar.hidden = true;
    view.innerHTML = '<div class="panel rise" style="--i:3">' + ART + '<h2>Create your first workspace</h2><p>A workspace holds your projects, monitors and teammates. Add a target and OntaPulse starts checking it.</p><div class="btns"><a class="btn" href="#">' + PLUS + 'Create workspace</a></div></div>';
    renderSide();
  }
  function showFull() {
    renderSide(); renderStats(); renderChips(); renderGrid();
    stats.hidden = false; toolbar.hidden = false;
  }

  if (state === 'loading') showLoading();
  else if (state === 'error') showError();
  else if (state === 'empty') showEmpty();
  else showFull();

  /* interactions */
  chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    filter = b.dataset.r; renderChips(); renderGrid();
  });
  $('q').addEventListener('input', function (e) { query = e.target.value.trim(); renderGrid(); });

  /* mobile drawer */
  var app = $('app'), menu = $('menu-btn');
  function setNav(open) { app.classList.toggle('nav-open', open); menu.setAttribute('aria-expanded', String(open)); if (open) $('sidebar').querySelector('a').focus(); else menu.focus(); }
  menu.addEventListener('click', function () { setNav(true); });
  $('scrim').addEventListener('click', function () { setNav(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && app.classList.contains('nav-open')) setNav(false); });

  document.querySelectorAll('a[href="#"]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); }); });
})();
</script>
</body>
</html>
