language: typescript

tasks:
  dev:
    command: "tsx watch src/server.ts"
    preset: server
    toolchains:
      - javascript
      - node
      - pnpm

  typecheck:
    command: "tsc --noEmit"
    toolchains:
      - javascript
      - node
      - pnpm

  test:
    command: "pnpm test"
    toolchains:
      - javascript
      - node
      - pnpm

  coverage:
    command: "pnpm coverage"
    toolchains:
      - javascript
      - node
      - pnpm

  format:
    command: "prettier --write ."
    toolchains:
      - javascript
      - node
      - pnpm
