language: typescript

tasks:
  dev:
    command: "pnpm run dev"
    preset: server
    toolchains:
      - javascript
      - node
      - pnpm

  typecheck:
    command: "pnpm run typecheck"
    toolchains:
      - javascript
      - node
      - pnpm

  test:
    command: "pnpm run test"
    toolchains:
      - javascript
      - node
      - pnpm
