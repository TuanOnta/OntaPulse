language: typescript

tasks:
  dev:
    command: "tsx watch src/server.ts"
    preset: server
    toolchains:
      - javascript
      - node
      - pnpm

  typecheck:
    command: "tsc --noEmit"
    toolchains:
      - javascript
      - node
      - pnpm

  test:
    command: "cross-env NODE_ENV=test vitest run"
    toolchains:
      - javascript
      - node
      - pnpm

  format:
    command: "prettier --write ."
    toolchains:
      - javascript
      - node
      - pnpm
