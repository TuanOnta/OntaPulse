language: python

tasks:
  check-db:
    command: "uv run --locked --no-sync python -m ontapulse_worker.entrypoints.commands.database_check"
    deps:
      - "worker:sync"
    options:
      cache: false

  dev:
    command: "uv run --locked --no-sync python -m ontapulse_worker.entrypoints.worker"
    preset: server
    deps:
      - "worker:sync"

  sync:
    command: "uv sync --locked --link-mode=copy"
    options:
      cache: false

  lint:
    command: "uv run --locked --no-sync ruff check ."
    deps:
      - "worker:sync"

  format:
    command: "uv run --locked --no-sync ruff format ."
    deps:
      - "worker:sync"
    options:
      cache: false

  format-check:
    command: "uv run --locked --no-sync ruff format --check ."
    deps:
      - "worker:sync"

  test:
    command: 'uv run --locked --no-sync pytest -m "not integration"'
    deps:
      - "worker:sync"

  integration-test:
    command: "uv run --locked --no-sync pytest -m integration -v"
    deps:
      - "worker:sync"
    env:
      WORKER_INFRA_TESTS: "1"
    options:
      envFile: "/.env"
