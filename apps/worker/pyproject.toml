[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ontapulse-worker"
version = "0.1.0"
description = "OntaPulse scan worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28.1",
  "pika>=1.3,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
ontapulse-worker-check = "ontapulse_worker.entrypoints.commands.database_check:main"

[dependency-groups]
dev = [
  "coverage>=7.16.1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["ontapulse_worker"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "infrastructure: explicitly selected tests using isolated PostgreSQL and RabbitMQ resources",
  "integration: tests requiring external infrastructure",
]

[tool.coverage.run]
branch = true
source = ["ontapulse_worker"]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
